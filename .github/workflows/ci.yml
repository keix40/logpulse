name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            services/ingest/go.sum
            services/worker/go.sum
            services/alerter/go.sum
            pkg/alertengine/go.sum
      - name: Sync workspace
        run: go work sync
      - name: Test packages
        run: |
          go test ./pkg/logevent ./pkg/alertengine
          go test ./services/ingest/...
          go test ./services/worker/...
          go test ./services/alerter/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          args: --timeout=5m
          working-directory: services/ingest
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
