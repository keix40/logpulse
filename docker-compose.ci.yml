# CI overlay: mock webhook receiver and smoke-friendly alert rules.
services:
  mockwebhook:
    build:
      context: .
      dockerfile: services/mockwebhook/Dockerfile
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  alerter:
    environment:
      SLACK_WEBHOOK_URL: http://mockwebhook:9090/webhook
      ALERT_RULES_PATH: /etc/logpulse/alerts-smoke.yaml
    volumes:
      - ./deploy/ci/alerts-smoke.yaml:/etc/logpulse/alerts-smoke.yaml:ro
    depends_on:
      mockwebhook:
        condition: service_healthy
